# Compila y ejecuta todas las pruebas del backend en cada push y pull request.
name: Backend CI

on:
  push:
    branches: [main, master, develop, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y probar
        run: ./mvnw -B -ntp verify
      - name: Publicar informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: target/surefire-reports/

  # Verifica la migración de esquema contra MySQL real (base nueva) arrancando la app.
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: colegio
          MYSQL_USER: admin
          MYSQL_PASSWORD: admin
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Empaquetar
        run: ./mvnw -B -ntp -DskipTests package
      - name: Arrancar contra MySQL 8 con datos demo
        env:
          JWT_SECRET: ci-solo-pruebas-secreto-de-al-menos-32-caracteres
          SEED_DEMO: 'true'
          ADMIN_INITIAL_PASSWORD: CiAdmin2026
          STORAGE_DIR: ${{ runner.temp }}/uploads
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/public/cursos > /dev/null; then break; fi
            sleep 2
          done
          grep -E "Migrating|Successfully applied|baselined" app.log || true
          curl -sf http://localhost:8080/api/public/cursos
          test "$(mysql -h127.0.0.1 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='colegio' AND data_type='enum'")" = "0"
      - name: Registro de arranque
        if: failure()
        run: cat app.log
