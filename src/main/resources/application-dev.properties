# Spring Boot Application Configuration - Development Profile

# ============ DATABASE CONFIGURATION ============
spring.datasource.url=jdbc:mysql://localhost:3306/colegio?useSSL=false&serverTimezone=UTC
spring.datasource.username=admin_dev
spring.datasource.password=dev_password_123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA/HIBERNATE CONFIGURATION ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============ JWT CONFIGURATION ============
jwt.secret=DevSecretKeyForTestingOnly32CharactersMin
jwt.expiration=86400000

# ============ SERVER CONFIGURATION ============
server.port=8080
server.ssl.enabled=false

# ============ LOGGING CONFIGURATION ============
logging.level.root=INFO
logging.level.com.rep=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============ MULTIPART CONFIGURATION ============
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# ============ ACTUATOR CONFIGURATION ============
management.endpoints.web.exposure.include=*

# ============ APPLICATION CONFIGURATION ============
spring.application.name=REP-Sistema-Educativo-Dev
app.migrate-users=true
