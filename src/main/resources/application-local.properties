# =====================================================================
# Perfil "local": instalación preconfigurada (lo usan los instaladores).
# Funciona sin configurar nada: base de datos embebida en REP_HOME, secreto JWT
# generado y guardado en REP_HOME, descubrimiento en red activado.
# Para usar MySQL en su lugar, arranque sin este perfil y defina DB_HOST, DB_NAME...
# =====================================================================
app.home=${REP_HOME:${user.home}/.rep}

# Base embebida H2 en modo compatible con MySQL (archivo en REP_HOME/datos)
spring.datasource.url=jdbc:h2:file:${app.home}/datos/rep;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=rep
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.storage.dir=${STORAGE_DIR:${app.home}/archivos}
logging.file.name=${app.home}/logs/rep-servidor.log
