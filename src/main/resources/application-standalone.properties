# ============================================
# CONFIGURACIÓN STANDALONE - Sistema Educativo
# ============================================
# Este perfil se activa automáticamente cuando se usa StandaloneLauncher
# NO requiere instalación de MySQL/MariaDB

# ========== INFORMACIÓN DE LA APLICACIÓN ==========
spring.application.name=Sistema Educativo REP - Standalone

# ========== BASE DE DATOS H2 EMBEBIDA ==========
spring.datasource.url=jdbc:h2:file:./data/sistema_educativo;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola H2 - Solo accesible localmente
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# ========== HIBERNATE/JPA ==========
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# ========== SERVIDOR WEB ==========
server.port=18080
server.address=127.0.0.1
server.servlet.context-path=/

# ========== ARCHIVOS Y UPLOADS ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true

# ========== LOGGING ==========
logging.file.name=./logs/application.log
logging.level.root=INFO
logging.level.com.rep=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Formato de logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Rotación de logs
logging.file.max-size=10MB
logging.file.max-history=7

# ========== SPRINGDOC (OpenAPI / Swagger) ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ========== SEGURIDAD JWT ==========
jwt.secret=Cjppnaty22#UnaClaveMasLargaQueLlegueA32Chars
jwt.expiration=86400000

# ========== CACHE ==========
spring.cache.type=simple

# ========== MIGRACIONES Y DATOS INICIALES ==========
# Habilitar/deshabilitar scripts SQL de inicio
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:schema.sql
# spring.sql.init.data-locations=classpath:data.sql

# Migración de usuarios
app.migrate-users=false

# ========== CORS ==========
spring.mvc.dispatch-options-request=true

# ========== MISCELÁNEOS ==========
spring.main.banner-mode=off
spring.main.lazy-initialization=false
spring.main.allow-bean-definition-overriding=false

# ========== ACTUATOR ==========
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ========== PERFILES ==========
spring.profiles.active=standalone
