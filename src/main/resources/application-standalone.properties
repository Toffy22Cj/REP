# ==========================================
# PERFIL STANDALONE (H2 embebida)
# ==========================================

# Base de datos H2
spring.datasource.url=jdbc:h2:file:./data/sistema_educativo;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate para H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Pool de conexiones Hikari
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=18080
server.servlet.context-path=/

# Logging
logging.file.name=./logs/application-standalone.log
logging.level.root=INFO
logging.level.com.rep=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Spring
spring.main.allow-bean-definition-overriding=true

# Aplicación
app.migrate-users=false
app.api.base-url=http://localhost:18080

# API Services - URLs CORREGIDAS para standalone
auth.service.url=http://localhost:18080/api/auth
estudiante.service.url=http://localhost:18080/api
app.update-check.enabled=false

# JWT (mismo que desarrollo)
jwt.secret=Cjppnaty22#UnaClaveMasLargaQueLlegueA32Chars
jwt.expiration=86400000

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB