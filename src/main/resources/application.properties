# =====================================================================
# REP - Configuración base
# Todos los valores sensibles se leen de variables de entorno.
# Ver .env.example y docs/modules/auth-security.md
# =====================================================================
spring.application.name=Main

# Carga automática del archivo .env de la raíz del proyecto (formato CLAVE=valor), si existe.
# Las variables de entorno del sistema tienen prioridad sobre este archivo.
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

# ---------- Base de datos ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:colegio}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Migraciones Flyway (src/main/resources/db/migration y com.rep... db.migration).
# Las bases existentes sin historial se marcan como versión 1 y solo reciben las nuevas.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------- JWT (obligatorio, mínimo 32 bytes) ----------
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ---------- Seguridad ----------
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
# Activar solo si la app está detrás de un proxy inverso de confianza
app.security.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}
# Administrador inicial (si no se define, se genera una contraseña aleatoria y se muestra en el log)
app.bootstrap.admin-password=${ADMIN_INITIAL_PASSWORD:}
# Intentos FALLIDOS de inicio de sesión permitidos por IP en la ventana indicada.
# El contador vive en memoria: reiniciar el servidor lo pone a cero.
app.security.rate-limit.login-per-15min=${LOGIN_MAX_INTENTOS:5}
app.security.rate-limit.login-window-minutes=${LOGIN_BLOQUEO_MINUTOS:15}
# Red: descubrimiento automático del servidor (UDP) y versión anunciada
app.red.descubrimiento.activo=${REP_DESCUBRIMIENTO:true}
app.red.descubrimiento.puerto=${REP_DESCUBRIMIENTO_PUERTO:47800}
app.red.anuncio.puerto=${REP_ANUNCIO_PUERTO:47801}
app.red.nombre=${REP_NOMBRE:}
app.red.hotspot.permitido=${REP_HOTSPOT:true}
app.red.mdns.activo=${REP_MDNS:true}
app.version=@project.version@
# Reporte de notas
app.notas.minima-aprobatoria=${NOTA_MINIMA_APROBATORIA:3.0}
app.notas.vencidas-cuentan-cero=${VENCIDAS_CUENTAN_CERO:true}
# Datos de demostración (ver DemoDataSeeder). Solo para desarrollo.
app.seed.demo=${SEED_DEMO:false}
app.migrate-users=true

# Cookie de sesión del panel web: no accesible desde JS y no enviada en peticiones cross-site
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
# Nunca devolver trazas ni mensajes internos en las páginas de error
server.error.include-stacktrace=never
# Compresión gzip de respuestas JSON/HTML/CSS/JS: reduce el tráfico en redes lentas
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/plain,text/csv
server.compression.min-response-size=1024
# Recursos estáticos del panel web en caché del navegador (se revalidan por ETag)
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=true
server.error.include-message=never

# ---------- Actuator: solo salud ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.rep=INFO
logging.file.name=logs/mi-aplicacion.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---------- Subida de archivos ----------
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:25MB}
# Directorio de archivos subidos (adjuntos de preguntas y material de estudio)
app.storage.dir=${STORAGE_DIR:${user.home}/.rep/uploads}
