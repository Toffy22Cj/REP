<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - REP</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <h1>REP Admin</h1>
            <p>Panel de Administración Local</p>

            <div id="alert" class="alert alert-error"></div>
            <!-- Primer acceso: contraseña provisional (solo en el propio servidor, una vez) -->
            <div id="primerAcceso" class="primer-acceso" hidden>
                <strong>⚠ Primer acceso al servidor</strong>
                <p>Esta contraseña provisional se muestra <b>una sola vez</b>. Cópiela ahora:
                   al entrar deberá cambiarla por una propia.</p>
                <dl>
                    <dt>Identificación</dt><dd id="paIdent"></dd>
                    <dt>Contraseña</dt><dd><code id="paClave"></code>
                        <button type="button" id="paCopiar" class="btn-copiar">Copiar</button></dd>
                </dl>
                <button type="button" id="paUsar" class="btn">Usar estos datos</button>
            </div>
            <div id="primerAccesoAviso" class="alert alert-info" hidden></div>

            <form id="loginForm" action="/admin/login" method="POST">
                <div class="form-group">
                    <label for="identificacion">Identificación</label>
                    <input type="text" id="identificacion" name="identificacion" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Ingresar</button>
            </form>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>

</html>
