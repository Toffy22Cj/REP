spring.application.name=REP-Test
spring.datasource.url=jdbc:h2:mem:colegiotest;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=TestSecretKeyForTestingPurposeOnly32CharactersMin!
jwt.expiration=86400000

app.migrate-users=false
java.awt.headless=true
